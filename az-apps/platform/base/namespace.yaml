# Application namespace. Pod Security Admission enforces the restricted
# profile; the label below lets ExternalSecrets here use the Key Vault store.
apiVersion: v1
kind: Namespace
metadata:
  name: web
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    secrets.platform/key-vault: allowed
