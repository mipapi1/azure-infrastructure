# Local smoke test (az-apps/tests/smoke.sh): no ingress controller, External
# Secrets or metrics server in kind. Uses the public base image by digest.
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  digest: sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c

probes:
  path: /

autoscaling:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  ingressNamespace: smoke
