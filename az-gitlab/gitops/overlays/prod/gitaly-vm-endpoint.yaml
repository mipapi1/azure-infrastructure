# Lets Managed Prometheus scrape the Gitaly VM (port 9236) through a selector-less Service.
apiVersion: v1
kind: Service
metadata:
  name: gitaly-vm
  namespace: gitlab
  labels:
    app.kubernetes.io/name: gitaly-vm
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 9236
      targetPort: 9236
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitaly-vm-1
  namespace: gitlab
  labels:
    kubernetes.io/service-name: gitaly-vm
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: http-metrics
    port: 9236
    protocol: TCP
endpoints:
  - addresses:
      - ${GITALY_ADDRESS}
