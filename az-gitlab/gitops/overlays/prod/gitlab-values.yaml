apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  values:
    global:
      gitaly:
        enabled: false
        external:
          - name: default
            hostname: ${GITALY_ADDRESS}
            port: "8075"
    gitlab:
      webservice:
        minReplicas: 3
      gitaly:
        persistence:
          enabled: false
