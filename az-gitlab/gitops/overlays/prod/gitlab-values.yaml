apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  values:
    gitlab:
      webservice:
        minReplicas: 3
      # Gitaly gets the gitaly pool to itself (one Standard_D8ds_v5 node), so other pods can't
      # compete for its CPU, memory or disk throughput.
      gitaly:
        nodeSelector:
          platform.workload: gitaly
        tolerations:
          - key: workload
            operator: Equal
            value: gitaly
            effect: NoSchedule
        resources:
          requests:
            cpu: "6"
            memory: 24Gi
          limits:
            cpu: "6"
            memory: 24Gi
