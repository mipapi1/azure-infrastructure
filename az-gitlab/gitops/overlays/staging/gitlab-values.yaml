apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  values:
    registry:
      hpa:
        minReplicas: 1
        maxReplicas: 2
    gitlab:
      webservice:
        minReplicas: 1
        maxReplicas: 2
      sidekiq:
        maxReplicas: 2
      gitlab-shell:
        minReplicas: 1
        maxReplicas: 2
