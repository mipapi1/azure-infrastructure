# GitLab Runner, Kubernetes executor. The manager runs on the gitlab pool in gitlab-runner; job
# pods run in ci-jobs on the tainted runner pool, unprivileged, as the ci-job service account
# (workload identity, AcrPush on the cluster registry and the push registries).
# No Docker-in-Docker: images are built with a rootless builder (README, "Building images").
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gitlab-runner
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.gitlab.io
---
# Trust bundle for the GitLab URL: a certificate from the same issuer carries the internal CA in
# ca.crt, which the runner reads through tls-ca-file.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-runner-trust
  namespace: gitlab-runner
spec:
  secretName: gitlab-runner-trust
  commonName: gitlab-runner.${GITLAB_DOMAIN}
  dnsNames:
    - gitlab-runner.${GITLAB_DOMAIN}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: platform-internal
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  interval: 30m
  dependsOn:
    - name: gitlab
      namespace: gitlab
  chart:
    spec:
      chart: gitlab-runner
      # Runner 19.4, matching the GitLab minor version.
      version: 0.93.0
      sourceRef:
        kind: HelmRepository
        name: gitlab-runner
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    # registry.gitlab.com is not an artifact cache upstream, so scripts/import-runner-images.sh
    # imports the runner and helper images into the cluster registry.
    image:
      registry: ${REGISTRY_LOGIN_SERVER}
      image: gitlab-org/gitlab-runner
      tag: alpine-v19.4.0

    gitlabUrl: https://gitlab.${GITLAB_DOMAIN}/
    concurrent: ${RUNNER_CONCURRENT}
    checkInterval: 3
    unregisterRunners: false
    terminationGracePeriodSeconds: 3600

    rbac:
      create: true
      clusterWideAccess: false
      rules:
        - resources: [events]
          verbs: [list, watch]
        - resources: [pods]
          verbs: [create, delete, get, list, watch]
        - resources: [pods/attach, pods/exec]
          verbs: [get, create, patch, delete]
        - resources: [pods/log]
          verbs: [get, list]
        - resources: [secrets]
          verbs: [create, delete, get, update]
        - resources: [configmaps]
          verbs: [create, delete, get, update]
        - resources: [serviceaccounts]
          verbs: [get]
    serviceAccount:
      create: true
      name: gitlab-runner

    metrics:
      enabled: true
      portName: metrics
      port: 9252
      serviceMonitor:
        enabled: false
    service:
      enabled: true

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      privileged: false
      capabilities:
        drop: [ALL]
    podSecurityContext:
      runAsUser: 100
      fsGroup: 65533
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    nodeSelector:
      platform.workload: gitlab
    tolerations:
      - key: workload
        operator: Equal
        value: gitlab
        effect: NoSchedule

    volumeMounts:
      - name: gitlab-trust
        mountPath: /home/gitlab-runner/trust
        readOnly: true
    volumes:
      - name: gitlab-trust
        secret:
          secretName: gitlab-runner-trust
          items:
            - key: ca.crt
              path: ca.crt

    runners:
      # runner-token from Key Vault (secrets.yaml). Create the runner in GitLab (Admin > CI/CD >
      # Runners) and store its glrt- token as gitlab-runner-token.
      secret: gitlab-runner-token  # checkov:skip=CKV_SECRET_6: Kubernetes Secret or Key Vault name, not a value
      jobNamespace: ci-jobs
      executor: kubernetes
      config: |
        [[runners]]
          tls-ca-file = "/home/gitlab-runner/trust/ca.crt"
          [runners.feature_flags]
            FF_USE_POD_ACTIVE_DEADLINE_SECONDS = true
          [runners.kubernetes]
            namespace = "ci-jobs"
            service_account = "ci-job"
            privileged = false
            allow_privilege_escalation = false
            image = "${REGISTRY_LOGIN_SERVER}/azurelinux/base/core:3.0"
            helper_image = "${REGISTRY_LOGIN_SERVER}/gitlab-org/gitlab-runner/gitlab-runner-helper:x86_64-v19.4.0"
            pull_policy = ["if-not-present"]
            allowed_pull_policies = ["if-not-present", "always"]
            # Job images only from the private registry (artifact cache rules or pushed images).
            allowed_images = ["${REGISTRY_LOGIN_SERVER}/**/*"]
            allowed_services = ["${REGISTRY_LOGIN_SERVER}/**/*"]
            cpu_request = "500m"
            memory_request = "1Gi"
            memory_limit = "4Gi"
            helper_cpu_request = "50m"
            helper_memory_request = "64Mi"
            helper_memory_limit = "256Mi"
            poll_timeout = 600
            [runners.kubernetes.node_selector]
              "platform.workload" = "ci"
            [runners.kubernetes.node_tolerations]
              "workload=ci" = "NoSchedule"
              "kubernetes.azure.com/scalesetpriority=spot" = "NoSchedule"
            [runners.kubernetes.pod_labels]
              "azure.workload.identity/use" = "true"
            [runners.kubernetes.pod_security_context]
              run_as_non_root = true
              run_as_user = 1000
              run_as_group = 1000
              fs_group = 1000
            [runners.kubernetes.build_container_security_context]
              [runners.kubernetes.build_container_security_context.capabilities]
                drop = ["ALL"]
            [runners.kubernetes.helper_container_security_context]
              [runners.kubernetes.helper_container_security_context.capabilities]
                drop = ["ALL"]
