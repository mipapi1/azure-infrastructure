# Credentials come from the cluster key vault through the platform ClusterSecretStore.
# scripts/seed-secrets.sh creates them; az-gitlab writes the Redis key. Nothing secret is in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-postgres
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: gitlab-postgres
  data:
    - secretKey: password
      remoteRef:
        key: gitlab-postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-redis
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: gitlab-redis
  data:
    - secretKey: password
      remoteRef:
        key: gitlab-redis-password
---
# Shared with the Gitaly VM (the same values are passed to its run command), so the chart must
# not generate its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-gitaly-shell
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: gitlab-gitaly-shell
  data:
    - secretKey: gitaly-token
      remoteRef:
        key: gitlab-gitaly-token
    - secretKey: shell-secret
      remoteRef:
        key: gitlab-shell-secret
---
# Entra ID sign-in: the OmniAuth provider document, built by seed-secrets.sh from the app
# registration (README, "Entra ID sign-in").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-oidc
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: gitlab-oidc
  data:
    - secretKey: provider
      remoteRef:
        key: gitlab-oidc-provider
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: gitlab-runner-token
    template:
      data:
        runner-registration-token: ""
        runner-token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: gitlab-runner-token
---
# Object storage and backup connections name the account only: GitLab authenticates with its
# workload identity, so these hold no credentials (D-033).
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-object-storage
  namespace: gitlab
type: Opaque
stringData:
  connection: |
    provider: AzureRM
    azure_storage_account_name: ${STORAGE_ACCOUNT}
    azure_storage_domain: ${STORAGE_DOMAIN}
  registry: |
    azure_v2:
      accountname: ${STORAGE_ACCOUNT}
      container: registry
      credentialstype: default_credentials
      realm: ${STORAGE_REALM}
  backup: |
    azure_storage_account_name: ${STORAGE_ACCOUNT}
    azure_storage_domain: ${STORAGE_DOMAIN}
