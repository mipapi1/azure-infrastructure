# Scrape targets for Azure Managed Prometheus (ama-metrics reads the azmonitoring.coreos.com
# CRDs). The chart's own ServiceMonitors use the Prometheus Operator API and stay off.
# Dashboards: ../dashboards, imported by scripts/import-dashboards.sh.
apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-webservice
  namespace: gitlab
spec:
  selector:
    matchLabels:
      app: webservice
      release: gitlab
  endpoints:
    - port: http-metrics-ws
      path: /metrics
      interval: 30s
    - port: http-metrics-wh
      path: /metrics
      interval: 30s
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gitlab-sidekiq
  namespace: gitlab
spec:
  selector:
    matchLabels:
      app: sidekiq
      release: gitlab
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
---
apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-exporter
  namespace: gitlab
spec:
  selector:
    matchLabels:
      app: gitlab-exporter
      release: gitlab
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
---
apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-shell
  namespace: gitlab
spec:
  selector:
    matchLabels:
      app: gitlab-shell
      release: gitlab
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
---
apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-registry
  namespace: gitlab
spec:
  selector:
    matchLabels:
      app: registry
      release: gitlab
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
---
# In-cluster Gitaly. The prod overlay replaces the selector with the Gitaly VM endpoint.
apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-gitaly
  namespace: gitlab
spec:
  selector:
    matchLabels:
      app: gitaly
      release: gitlab
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
---
apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  selector:
    matchLabels:
      app: gitlab-runner
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
