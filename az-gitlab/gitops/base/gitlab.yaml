# GitLab chart with managed backing services: PostgreSQL, Redis and blob storage are Azure
# services on private endpoints (az-gitlab), so the bundled PostgreSQL, Redis, MinIO, NGINX,
# cert-manager, Prometheus and runner are off. Base values run Gitaly as a StatefulSet; the prod
# overlay switches to the Gitaly VM.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gitlab
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.gitlab.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  interval: 30m
  timeout: 30m
  chart:
    spec:
      chart: gitlab
      # GitLab 19.4. Upgrade one minor at a time and run the canary (staging) first.
      version: 10.4.3
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      remediateLastFailure: false
  values:
    global:
      edition: ee
      hosts:
        domain: ${GITLAB_DOMAIN}
        https: true
        gitlab:
          name: gitlab.${GITLAB_DOMAIN}
        registry:
          name: registry.${GITLAB_DOMAIN}
        kas:
          name: kas.${GITLAB_DOMAIN}
        ssh: ssh.${GITLAB_DOMAIN}

      # Ingress through the GitLab application routing controller (ingress-controller.yaml).
      gatewayApi:
        enabled: false
        installEnvoy: false
        configureCertmanager: false
      ingress:
        enabled: true
        # Explicit, so ingressClassName is set however the chart is rendered.
        apiVersion: networking.k8s.io/v1
        provider: nginx
        class: nginx-gitlab
        configureCertmanager: false
        tls:
          enabled: true
          secretName: gitlab-tls

      # Every GitLab pod runs on the tainted gitlab pool.
      nodeSelector:
        platform.workload: gitlab
      tolerations:
        - key: workload
          operator: Equal
          value: gitlab
          effect: NoSchedule

      # One service account, federated to the GitLab identity (namespaces.yaml).
      serviceAccount:
        enabled: true
        create: false
        name: gitlab

      # The platform internal CA (ca.crt of the TLS secret), so components trust each other's
      # external URLs.
      certificates:
        customCAs:
          - secret: gitlab-tls
            keys:
              - ca.crt

      # Azure Database for PostgreSQL requires TLS. The chart's psql.ssl is mutual TLS with
      # client certificates, so the mode is set through libpq instead (D-033).
      extraEnv:
        PGSSLMODE: require

      psql:
        host: ${POSTGRES_HOST}
        port: 5432
        username: ${POSTGRES_USER}
        database: gitlabhq_production
        password:
          secret: gitlab-postgres
          key: password

      # Azure Managed Redis: TLS on 10000, single endpoint (EnterpriseCluster policy).
      redis:
        host: ${REDIS_HOST}
        port: 10000
        scheme: rediss
        auth:
          enabled: true
          secret: gitlab-redis
          key: password

      gitaly:
        authToken:
          secret: gitlab-gitaly-shell
          key: gitaly-token
      shell:
        authToken:
          secret: gitlab-gitaly-shell
          key: shell-secret

      minio:
        enabled: false

      registry:
        bucket: registry

      appConfig:
        object_store:
          enabled: true
          proxy_download: true
          connection:
            secret: gitlab-object-storage
            key: connection
        lfs:
          bucket: git-lfs
        artifacts:
          bucket: gitlab-artifacts
        uploads:
          bucket: gitlab-uploads
        packages:
          bucket: gitlab-packages
        externalDiffs:
          enabled: true
          bucket: gitlab-mr-diffs
        terraformState:
          enabled: true
          bucket: gitlab-terraform-state
        ciSecureFiles:
          enabled: true
          bucket: gitlab-ci-secure-files
        dependencyProxy:
          enabled: true
          bucket: gitlab-dependency-proxy
        backups:
          bucket: gitlab-backups
          tmpBucket: tmp

        # Entra ID sign-in (README, "Entra ID sign-in"). Access is decided by the enterprise
        # application's user assignment, so users created on first sign-in are not blocked.
        omniauth:
          enabled: true
          allowSingleSignOn: [openid_connect]
          autoLinkUser: [openid_connect]
          blockAutoCreatedUsers: false
          syncProfileFromProvider: [openid_connect]
          syncProfileAttributes: [name, email]
          providers:
            - secret: gitlab-oidc
              key: provider

        enableUsagePing: false

    # Bundled components replaced by Azure services or platform add-ons.
    installCertmanager: false
    nginx-ingress:
      enabled: false
    prometheus:
      install: false
    gitlab-runner:
      install: false
    traefik:
      install: false

    # Generates the secrets that only GitLab uses (rails, workhorse, registry HTTP, KAS).
    # scripts/backup-gitlab-secrets.sh copies them to Key Vault after the first install.
    shared-secrets:
      enabled: true

    registry:
      podLabels:
        azure.workload.identity/use: "true"
      storage:
        secret: gitlab-object-storage
        key: registry
      hpa:
        minReplicas: 2
        maxReplicas: 6
      metrics:
        enabled: true

    gitlab:
      webservice:
        podLabels:
          azure.workload.identity/use: "true"
        minReplicas: 2
        maxReplicas: 8
        ingress:
          proxyBodySize: "0"
        resources:
          requests:
            cpu: "1"
            memory: 2.5Gi
          limits:
            memory: 4Gi

      sidekiq:
        podLabels:
          azure.workload.identity/use: "true"
        minReplicas: 1
        maxReplicas: 6
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi

      toolbox:
        podLabels:
          azure.workload.identity/use: "true"
        backups:
          objectStorage:
            backend: azure
            config:
              secret: gitlab-object-storage
              key: backup
          cron:
            enabled: true
            schedule: ${BACKUP_SCHEDULE}
            # Backup staging space for the repository archive before upload.
            persistence:
              enabled: true
              useGenericEphemeralVolume: true
              storageClass: managed-csi-premium
              size: 100Gi
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi

      # Git over SSH: the only LoadBalancer service outside app-routing-system, internal, on a
      # fixed address (guardrails.yaml).
      gitlab-shell:
        minReplicas: 2
        maxReplicas: 4
        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          annotations:
            service.beta.kubernetes.io/azure-load-balancer-internal: "true"
            service.beta.kubernetes.io/azure-load-balancer-ipv4: ${GITLAB_SSH_IP}

      # In-cluster Gitaly (base). The prod overlay disables it for the Gitaly VM.
      gitaly:
        persistence:
          enabled: true
          storageClass: managed-csi-premium
          size: ${GITALY_DISK_SIZE}
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 6Gi

      gitlab-exporter:
        enabled: true
