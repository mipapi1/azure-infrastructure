# GitLab on AKS, cluster side. Reconciled by the cluster Flux (az-aks/gitops/clusters/<cluster>/gitlab.yaml)
# with ${VARS} substituted from the gitlab-settings ConfigMap (az-gitlab deployment outputs).
# Uses the External Secrets Operator and cert-manager that az-aks installs. Everything here is
# namespaced except the Gitaly StorageClass and PriorityClass (gitaly.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - guardrails.yaml
  - ingress-controller.yaml
  - certificate.yaml
  - gitaly.yaml
  - secrets.yaml
  - gitlab.yaml
  - runner.yaml
  - monitoring.yaml
