# Checkov IaC and secret scanning. Skipped checks are explained in docs/DECISIONS.md.
# Azure IaC is covered by PSRule for Azure (make psrule). Checkov covers the
# rest: Kubernetes, Helm, workflows, Dockerfiles and secrets.
framework:
  - kubernetes
  - helm
  - kustomize
  - github_actions
  - dockerfile
  - secrets
skip-path:
  - out
  - .work
  - .git
compact: true
quiet: true
download-external-modules: false
skip-check:
  # Tooling image is a CLI, not a long-running service.
  - CKV_DOCKER_2
  # CPU limits throttle workloads; charts set CPU requests and memory limits (D-023).
  - CKV_K8S_11
