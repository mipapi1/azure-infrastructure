# GitLab on the dedicated tools cluster (az-gitlab placement Dedicated).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 30m
  retryInterval: 5m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: cluster-config
  path: ./az-gitlab/gitops/overlays/prod
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: gitlab-settings
