# az-gitlab output gitlabSettings (scripts/write-gitlab-settings.sh regenerates this file).
# Placeholders until az-gitlab is deployed. No secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-settings
  namespace: flux-system
data:
  GITLAB_DOMAIN: git-staging.example.internal
  GITLAB_INGRESS_IP: 10.120.0.250
  GITLAB_SSH_IP: 10.120.0.251
  GITLAB_CLIENT_ID: "<gitlab-client-id>"
  CI_CLIENT_ID: "<ci-client-id>"
  POSTGRES_HOST: "<postgres-server>.postgres.database.azure.com"
  POSTGRES_USER: gitlab
  REDIS_HOST: "<redis-name>.eastus.redis.azure.net"
  STORAGE_ACCOUNT: "<storage-account>"
  STORAGE_DOMAIN: blob.core.windows.net
  STORAGE_REALM: core.windows.net
  GITALY_DISK_SIZE: 64Gi
  BACKUP_SCHEDULE: "0 3 * * 0"
  RUNNER_CONCURRENT: "4"
  KEYCLOAK_HOST: sso
  KEYCLOAK_DB_HOST: ""
  KEYCLOAK_REPLICAS: "1"
