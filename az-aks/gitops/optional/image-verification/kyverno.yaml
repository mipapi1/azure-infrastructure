# Kyverno admission controller with workload identity (az-aks addons.imageVerification), so it
# can read signatures from the private registry. Background, cleanup and reports controllers
# are kept small; only image verification is used.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 12h
  url: https://kyverno.github.io/kyverno
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      # Kyverno 1.19.
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admissionController:
      replicas: 3
      podLabels:
        azure.workload.identity/use: "true"
      rbac:
        serviceAccount:
          name: kyverno-admission-controller
          annotations:
            azure.workload.identity/client-id: ${IMAGE_VERIFICATION_CLIENT_ID}
            azure.workload.identity/tenant-id: ${AZURE_TENANT_ID}
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    backgroundController:
      replicas: 1
    cleanupController:
      replicas: 1
    reportsController:
      replicas: 1
    # Don't let Kyverno block the system namespaces if it is unavailable.
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: [kube-system, flux-system]
