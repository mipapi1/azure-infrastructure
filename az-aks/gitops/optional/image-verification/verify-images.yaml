# Closes the D-022 gap: images from the cluster registry must carry a keyless cosign signature
# from the CI identity. Audit by default (IMAGE_VERIFICATION_ACTION); set Deny once every
# workload image is signed. Images from the registry's artifact cache (cache/...) are upstream
# images and are not checked.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-registry-signatures
spec:
  validationActions: [${IMAGE_VERIFICATION_ACTION}]
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, flux-system]
  matchImageReferences:
    - expression: >-
        image.startsWith("${REGISTRY_LOGIN_SERVER}/") &&
        !image.startsWith("${REGISTRY_LOGIN_SERVER}/cache/")
  credentials:
    providers: [azure]
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - issuer: ${SIGNING_ISSUER}
              subjectRegExp: ${SIGNING_SUBJECT_REGEXP}
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
      message: Images from the cluster registry must be signed by the CI pipeline (D-022).
