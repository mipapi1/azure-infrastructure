# One runner scale set (runs-on: platform-ci) on the tainted runner pool. No Docker-in-Docker
# and no privileged pods: build images with a rootless builder, as on GitLab (D-033). The GitHub
# App credentials come from Key Vault secret github-arc-app, a JSON object with github_app_id,
# github_app_installation_id and github_app_private_key.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    pod-security.kubernetes.io/enforce: baseline
    platform.azure.com/key-vault: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-arc-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: github-arc-app
  dataFrom:
    - extract:
        key: github-arc-app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-ci
  namespace: arc-runners
spec:
  interval: 30m
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  values:
    githubConfigUrl: ${GITHUB_CONFIG_URL}
    githubConfigSecret: github-arc-app  # checkov:skip=CKV_SECRET_6: Kubernetes Secret or Key Vault name, not a value
    runnerScaleSetName: platform-ci
    minRunners: 0
    maxRunners: 10
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller
    template:
      spec:
        nodeSelector:
          platform.workload: ci
        tolerations:
          - key: workload
            operator: Equal
            value: ci
            effect: NoSchedule
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 123
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.0
            command: [/home/runner/run.sh]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests: { cpu: 500m, memory: 1Gi }
              limits: { memory: 4Gi }
