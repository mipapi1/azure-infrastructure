# Trivy Operator: VulnerabilityReport, ConfigAuditReport and ExposedSecretReport resources for
# running workloads. One built-in Trivy server holds the vulnerability database so scan jobs
# don't each download it. Images and the database come from ghcr.io (already in the cluster
# egress allowlist) instead of the chart default mirror.gcr.io.
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: aqua
  namespace: flux-system
spec:
  interval: 12h
  url: https://aquasecurity.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      # Trivy Operator 0.35.
      chart: trivy-operator
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    excludeNamespaces: kube-system,trivy-system
    image:
      registry: ghcr.io
      repository: aquasecurity/trivy-operator
    operator:
      builtInTrivyServer: true
      scanJobsConcurrentLimit: 3
      scanJobTTL: 10m
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      exposedSecretScannerEnabled: true
      sbomGenerationEnabled: false
    trivy:
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
      dbRegistry: ghcr.io
      dbRepository: aquasecurity/trivy-db
      javaDbRegistry: ghcr.io
      javaDbRepository: aquasecurity/trivy-java-db
      ignoreUnfixed: true
      severity: HIGH,CRITICAL
    policiesBundle:
      registry: ghcr.io
      repository: aquasecurity/trivy-checks
    serviceMonitor:
      enabled: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
