# One store for the workload key vault. Only namespaces labelled
# secrets.platform/key-vault=allowed can use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.platform/key-vault: allowed
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${KEY_VAULT_URI}
      tenantId: ${AZURE_TENANT_ID}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
