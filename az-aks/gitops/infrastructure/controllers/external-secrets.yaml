# External Secrets Operator. It reads Key Vault with workload identity: the
# service account below is federated to the identity created by az-aks
# (output externalSecretsClientId), which has Key Vault Secrets User.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: 2.13.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    replicaCount: 2
    serviceAccount:
      create: true
      name: external-secrets
      annotations:
        azure.workload.identity/client-id: ${EXTERNAL_SECRETS_CLIENT_ID}
        azure.workload.identity/tenant-id: ${AZURE_TENANT_ID}
    # Only cluster-scoped stores managed here; teams can't bring their own credentials.
    processSecretStore: false
    processClusterStore: true
    processPushSecret: false
    processClusterPushSecret: false
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
    webhook:
      replicaCount: 2
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 128Mi }
    certController:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { memory: 256Mi }
