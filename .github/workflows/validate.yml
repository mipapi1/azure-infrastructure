name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep:
    name: bicep build, lint, format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build tooling image
        run: make tools
      - run: make build
      - run: make lint
      - run: make format-check

  psrule:
    name: PSRule for Azure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make tools
      - run: make psrule

  scan:
    name: IaC and secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov
        run: |
          docker run --rm -v "$PWD":/src -w /src bridgecrew/checkov:3.3.17 \
            --config-file .checkov.yaml --directory /src \
            --output cli --output sarif --output-file-path console,/src/checkov.sarif
      - name: Upload SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: checkov.sarif
          category: checkov

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make tools
      - run: make k8s

  smoke:
    name: Apps smoke test (kind)
    runs-on: ubuntu-24.04
    needs: kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make tools
      - run: make smoke

  image-builder-tests:
    name: Image Builder offline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make tools
      - name: Test-ImageBuilder.ps1
        run: >
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src azinfra-tools:local
          pwsh -NoProfile -File az-image-builder/tests/Test-ImageBuilder.ps1
