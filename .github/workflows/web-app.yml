name: web-app

# Build, scan, sign and push the sample application, then promote it by digest
# through GitOps: staging first, prod after an approval on the prod environment.
#
# Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (per environment), REGISTRY_NAME (per environment) and PUBLISH_RUNNER, a
# self-hosted runner label inside a network that can reach the private registry.

on:
  pull_request:
    paths:
      - az-apps/src/web-app/**
      - .github/workflows/web-app.yml
  push:
    branches: [main]
    paths:
      - az-apps/src/web-app/**
      - .github/workflows/web-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: web-app
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  build:
    name: Build and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: |
          docker buildx build az-apps/src/web-app \
            --platform linux/amd64 \
            --provenance=mode=max --sbom=true \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --output type=docker,dest=image.tar \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}"
          docker load -i image.tar

      - name: Scan (fails on fixable high and critical findings)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work "$TRIVY_IMAGE" \
            image --format sarif --output trivy.sarif "${IMAGE_NAME}:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "${IMAGE_NAME}:${GITHUB_SHA}"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-web-app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    name: Push and sign
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ vars.PUBLISH_RUNNER || 'ubuntu-24.04' }}
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Push
        id: push
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
        run: |
          az acr login --name "$REGISTRY_NAME"
          server="$(az acr show --name "$REGISTRY_NAME" --query loginServer -o tsv)"
          docker load -i image.tar
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${server}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${server}/${IMAGE_NAME}:${GITHUB_SHA}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${server}/${IMAGE_NAME}:${GITHUB_SHA}" | cut -d@ -f2)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${server}/${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless, GitHub OIDC identity)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

  promote-staging:
    name: Promote to staging
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: az-apps/ci/promote.sh staging "$DIGEST"

  promote-prod:
    name: Promote to prod
    needs: [publish, promote-staging]
    runs-on: ubuntu-24.04
    # Required reviewers on the prod environment are the promotion gate.
    environment: prod
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: az-apps/ci/promote.sh prod "$DIGEST"
