# PSRule for Azure. Expands each .bicepparam file into the resources it would
# deploy and checks them against the Well-Architected rule set.
requires:
  PSRule.Rules.Azure: '>=1.47.0'

include:
  module:
    - PSRule.Rules.Azure

input:
  pathIgnore:
    - '.work/'
    - 'az-image-builder/tests/'
    - '**/*.bicep'

configuration:
  AZURE_BICEP_FILE_EXPANSION: false
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true
  AZURE_BICEP_CHECK_TOOL: true
  # Compilation runs under emulation on Apple silicon; allow for it.
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 180
  AZURE_BICEP_MINIMUM_VERSION: '0.47.16'
  AZURE_PARAMETER_FILE_EXPANSION: false
  # Placeholder subscription used during expansion. No Azure call is made.
  AZURE_SUBSCRIPTION:
    subscriptionId: '00000000-0000-0000-0000-000000000000'
    displayName: 'validation'
  AZURE_TENANT:
    tenantId: '00000000-0000-0000-0000-000000000000'

rule:
  # Exclusions are listed with the reason in docs/DECISIONS.md.
  exclude: []

suppression:
  # D-005: image builder content storage, reproducible from the publish tools.
  Azure.Storage.UseReplication:
    - aibprodeusst
  # D-007: staging runs without zones or workspace replication to save cost.
  Azure.Firewall.AvailabilityZone:
    - hub-staging-eus-afw
  Azure.PublicIP.AvailabilityZone:
    - hub-staging-eus-afw-pip
  Azure.Log.Replication:
    - hub-staging-eus-law
  # D-007: AVM key vault 'keys' holds key definitions, not secret values.
  Azure.Deployment.SecureParameter:
    - hub-prod-eus-kv-deploy
    - hub-staging-eus-kv-deploy
  # D-007: Bastion must reach VMs on 22/3389; that is its purpose.
  Azure.NSG.LateralTraversal:
    - hub-prod-eus-vnet-AzureBastionSubnet-nsg
    - hub-staging-eus-vnet-AzureBastionSubnet-nsg

output:
  culture:
    - en-US
